name: Deploy Website to Fornex via SSH Key

on:
  push:
    branches:
      - eye-clinic-site

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  web-deploy:
    name: 🚀 Deploy WordPress via Rsync/SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ignore

      - name: 🔎 PHP Syntax Check
        run: |
          find wp-content -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: 📂 Sync files with Rsync over SSH
        run: |
          rsync -avz --delete-delay \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.junie' \
            --exclude='node_modules' \
            --exclude='.DS_Store' \
            --exclude='error_log' \
            --exclude='wp-config.php' \
            --exclude='.htaccess' \
            --exclude='wp-content/uploads' \
            --exclude='wp-content/cache' \
            --exclude='wp-content/upgrade' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/a49718/public_html/med.uz.ua/